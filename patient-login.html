<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login - CarePlus Hospital</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* Phase 3.1: Compact Patient Login Styles */
        .patient-login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color) 0%, #005aca 100%);
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            max-width: 400px;
            width: 100%;
            padding: 40px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 12px;
        }

        .login-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--secondary-color);
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--text-light);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: var(--transition);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1);
        }

        .otp-input-group {
            display: flex;
            gap: 8px;
        }

        #otpInput {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 8px;
            font-family: 'Courier New', monospace;
            transition: var(--transition);
            text-transform: uppercase;
        }

        #otpInput:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }

        .submit-btn:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
        }

        .message.success {
            background: #d1f2d5;
            color: #237c37;
            display: block;
        }

        .message.error {
            background: #ffd5d5;
            color: #d10000;
            display: block;
        }

        .message.info {
            background: #e3f2fd;
            color: #0071e3;
            display: block;
        }

        .divider {
            text-align: center;
            margin: 24px 0;
            color: var(--text-light);
            font-size: 13px;
            display: none;
        }

        .other-login-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            display: none;
        }

        .other-login-btn {
            padding: 10px;
            background: transparent;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--primary-color);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            text-align: center;
        }

        .other-login-btn:hover {
            background: rgba(0, 113, 227, 0.08);
            text-decoration: underline;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-light);
        }

        .back-link a {
            color: var(--primary-color);
            font-weight: 500;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .timer {
            font-size: 12px;
            color: var(--text-light);
            text-align: center;
            margin-top: 8px;
        }

        .phone-input-group {
            display: flex;
            gap: 8px;
        }

        .country-code {
            width: 70px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--background-color);
            font-size: 14px;
            text-align: center;
        }

        .phone-number {
            flex: 1;
        }

        /* Name Collection Modal - Phase 3.1 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }

        .modal-header {
            margin-bottom: 24px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--secondary-color);
            margin-bottom: 8px;
        }

        .modal-subtitle {
            font-size: 14px;
            color: var(--text-light);
        }

        .modal-body {
            margin-bottom: 24px;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .modal-btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .modal-btn-primary:hover {
            background: var(--primary-hover);
        }

        .modal-btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }

            .login-logo {
                font-size: 28px;
            }

            .login-title {
                font-size: 18px;
            }

            .modal-content {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="patient-login-container">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <div class="login-logo">CarePlus</div>
                <div class="login-title">Patient Login</div>
                <div class="login-subtitle">Access your health records</div>
            </div>

            <!-- Message Display -->
            <div class="message" id="authMessage"></div>

            <!-- Phone Number Form -->
            <form id="phoneForm">
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <div class="phone-input-group">
                        <input type="text" class="country-code" value="+91" disabled>
                        <input type="tel" id="phoneNumber" class="form-input phone-number" 
                               placeholder="Enter 10-digit number" pattern="[0-9]{10}" maxlength="10" required>
                    </div>
                    <small style="font-size: 12px; color: var(--text-light); margin-top: 6px;">
                        We'll send a one-time password to your number
                    </small>
                </div>
                <button type="submit" class="submit-btn" id="sendOtpBtn">Send OTP</button>
            </form>

            <!-- OTP Verification Form (Hidden initially) -->
            <form id="otpForm" style="display: none;">
                <div class="form-group">
                    <label class="form-label">Enter OTP</label>
                    <p style="font-size: 13px; color: var(--text-light); margin-bottom: 12px;">
                        We've sent a 6-digit code to your phone
                    </p>
                    <input type="text" id="otpInput" class="form-input" 
                           placeholder="Enter 6-digit code" pattern="[0-9]{6}" maxlength="6" 
                           inputmode="numeric" required>
                    <div class="timer" id="timer"></div>
                </div>
                <button type="submit" class="submit-btn" id="verifyOtpBtn">Verify OTP</button>
                <button type="button" class="submit-btn" style="background: var(--background-color); color: var(--text-main); border: 1px solid var(--border-color);" 
                        onclick="resetForm()">← Back</button>
            </form>

            <!-- Divider -->
            <div class="divider" id="dividerOrText" style="display: none;">OR</div>

            <!-- Doctor / Admin Login (Secondary Option) -->
            <div class="other-login-options" id="otherOptions" style="display: none;">
                <p style="font-size: 12px; color: var(--text-light); text-align: center; margin-bottom: 8px;">
                    Internal Users
                </p>
                <a href="auth.html" class="other-login-btn">Doctor / Admin Login</a>
            </div>

            <!-- Back Link -->
            <div class="back-link">
                <a href="index.html">← Back to Home</a>
            </div>

            <!-- Name Collection Modal - Phase 3.1 -->
            <div class="modal-overlay" id="nameModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <div class="modal-title">Welcome to CarePlus! 👋</div>
                        <div class="modal-subtitle">Please complete your profile</div>
                    </div>
                    <form id="nameForm">
                        <div class="modal-body">
                            <div class="form-group">
                                <label class="form-label" style="text-align: left;">Full Name</label>
                                <input type="text" id="patientName" class="form-input" 
                                       placeholder="Enter your full name" required 
                                       style="text-align: left;">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="modal-btn modal-btn-primary" id="saveNameBtn">
                                Continue
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // Phase 3.1: Patient Phone-Based OTP Login
        import { db } from './assets/js/firebase.js';
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const phoneForm = document.getElementById('phoneForm');
        const otpForm = document.getElementById('otpForm');
        const phoneInput = document.getElementById('phoneNumber');
        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const verifyOtpBtn = document.getElementById('verifyOtpBtn');
        const authMessage = document.getElementById('authMessage');
        const dividerOrText = document.getElementById('dividerOrText');
        const otherOptions = document.getElementById('otherOptions');
        const otpInput = document.getElementById('otpInput');
        const timerDiv = document.getElementById('timer');

        let otpSent = false;
        let otpCode = '';
        let timeLeft = 300;
        let timerInterval = null;

        // Phase 3.1: OTP input validation - only numeric, max 6 digits
        otpInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 6);
        });

        // Phase 3.1: Send OTP (Mock)
        phoneForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const phone = phoneInput.value;
            if (!phone || phone.length !== 10) {
                showMessage('Please enter a valid 10-digit phone number', 'error');
                return;
            }

            try {
                sendOtpBtn.disabled = true;
                sendOtpBtn.textContent = 'Sending...';

                // Phase 3.1: Mock OTP generation (in real app, use Firebase Auth Phone)
                // Allow any phone number - patient will be auto-created on first login
                otpCode = String(Math.floor(100000 + Math.random() * 900000));
                console.log(`[DEMO] OTP for ${phone}: ${otpCode}`);

                showMessage(`✓ OTP sent to +91${phone}. (Demo: ${otpCode})`, 'info');
                
                // Store phone in sessionStorage for verification
                sessionStorage.setItem('phoneForOtp', phone);
                otpSent = true;

                // Show OTP form
                phoneForm.style.display = 'none';
                otpForm.style.display = 'block';
                dividerOrText.style.display = 'block';
                otherOptions.style.display = 'flex';

                // Start timer
                startTimer();

                // Focus on first OTP input
                otpInputs[0].focus();

            } catch (error) {
                console.error('Error sending OTP:', error);
                showMessage('Failed to send OTP. Please try again.', 'error');
            } finally {
                sendOtpBtn.disabled = false;
                sendOtpBtn.textContent = 'Send OTP';
            }
        });

        // Phase 3.1: Verify OTP
        otpForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const enteredOtp = otpInput.value.trim();
            const phone = sessionStorage.getItem('phoneForOtp');

            if (enteredOtp.length !== 6) {
                showMessage('Please enter all 6 digits', 'error');
                return;
            }

            try {
                verifyOtpBtn.disabled = true;
                verifyOtpBtn.textContent = 'Verifying...';

                // Phase 3.1: Verify OTP
                if (enteredOtp !== otpCode) {
                    showMessage('Invalid OTP. Please try again.', 'error');
                    verifyOtpBtn.disabled = false;
                    verifyOtpBtn.textContent = 'Verify OTP';
                    return;
                }

                showMessage('✓ OTP verified! Setting up your account...', 'success');

                // Phase 3.1: Check if patient exists in users collection
                const { collection: firestoreCollection, addDoc, serverTimestamp, query: firestoreQuery, where, getDocs } = 
                    await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");

                const usersRef = firestoreCollection(db, 'users');
                const q = firestoreQuery(usersRef, where('phone', '==', phone), where('role', '==', 'patient'));
                const querySnapshot = await getDocs(q);

                let patientDoc;
                let isNewPatient = false;

                if (querySnapshot.empty) {
                    // Auto-create new patient record on first login
                    console.log(`[AUTO-CREATE] Creating new patient record for phone: ${phone}`);
                    isNewPatient = true;
                    
                    const newPatientData = {
                        phone: phone,
                        role: 'patient',
                        name: `Patient - ${phone}`,
                        email: `patient-${phone}@careplus.local`,
                        createdAt: serverTimestamp(),
                        lastLogin: serverTimestamp(),
                        status: 'active'
                    };

                    const docRef = await addDoc(usersRef, newPatientData);
                    patientDoc = {
                        id: docRef.id,
                        data: newPatientData
                    };
                    console.log(`[AUTO-CREATE] Patient record created with ID: ${docRef.id}`);
                } else {
                    // Existing patient - just update lastLogin
                    const { updateDoc, doc } = 
                        await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
                    
                    const docRef = doc(db, 'users', querySnapshot.docs[0].id);
                    await updateDoc(docRef, { 
                        lastLogin: serverTimestamp() 
                    });
                    
                    patientDoc = {
                        id: querySnapshot.docs[0].id,
                        data: querySnapshot.docs[0].data()
                    };
                    console.log(`[LOGIN] Patient login updated: ${querySnapshot.docs[0].id}`);
                }

                // Store phone and patient doc in session for name collection
                sessionStorage.setItem('patientDoc', JSON.stringify(patientDoc));
                sessionStorage.setItem('isNewPatient', isNewPatient);

                // If new patient, show name collection modal. Otherwise, complete login
                if (isNewPatient) {
                    otpForm.style.display = 'none';
                    dividerOrText.style.display = 'none';
                    otherOptions.style.display = 'none';
                    showMessage('', 'info'); // Clear message
                    document.getElementById('nameModal').classList.add('active');
                } else {
                    completeLogin(patientDoc, phone);
                }

            } catch (error) {
                console.error('Error verifying OTP:', error);
                showMessage('Verification failed. Please try again.', 'error');
                verifyOtpBtn.disabled = false;
                verifyOtpBtn.textContent = 'Verify OTP';
            }
        });

        // Phase 3.1: Handle name collection form
        document.getElementById('nameForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const patientName = document.getElementById('patientName').value.trim();
            const saveNameBtn = document.getElementById('saveNameBtn');

            if (!patientName) {
                alert('Please enter your full name');
                return;
            }

            try {
                saveNameBtn.disabled = true;
                saveNameBtn.textContent = 'Saving...';

                // Update patient name in Firestore
                const { updateDoc, doc } = 
                    await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");

                const patientDoc = JSON.parse(sessionStorage.getItem('patientDoc'));
                const phone = sessionStorage.getItem('phoneForOtp');

                const docRef = doc(db, 'users', patientDoc.id);
                await updateDoc(docRef, { name: patientName });

                console.log(`[PROFILE] Patient name updated: ${patientName}`);

                // Update local patient doc with new name
                patientDoc.data.name = patientName;

                // Close modal and complete login
                document.getElementById('nameModal').classList.remove('active');
                completeLogin(patientDoc, phone);

            } catch (error) {
                console.error('Error saving name:', error);
                alert('Failed to save your name. Please try again.');
                saveNameBtn.disabled = false;
                saveNameBtn.textContent = 'Continue';
            }
        });

        // Phase 3.1: Complete login process and redirect to home
        function completeLogin(patientDoc, phone) {
            // Create session
            sessionStorage.setItem('careplus_user', JSON.stringify({
                uid: patientDoc.id,
                phone: phone,
                role: 'patient',
                name: patientDoc.data.name || 'Patient',
                email: patientDoc.data.email || `patient-${phone}@careplus.local`
            }));

            showMessage('✓ Login successful! Redirecting...', 'success');

            // Redirect to home page (index.html)
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }

        // Phase 3.1: Start OTP timer
        function startTimer() {
            timeLeft = 300;
            timerInterval = setInterval(() => {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDiv.textContent = `Resend OTP in ${minutes}:${seconds.toString().padStart(2, '0')}`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerDiv.textContent = 'OTP expired. Click "Back" and try again.';
                    otpInput.disabled = true;
                }
            }, 1000);
        }

        // Phase 3.1: Show message
        function showMessage(msg, type) {
            authMessage.textContent = msg;
            authMessage.className = `message ${type}`;
        }

        // Phase 3.1: Reset form
        window.resetForm = () => {
            clearInterval(timerInterval);
            phoneForm.style.display = 'block';
            otpForm.style.display = 'none';
            dividerOrText.style.display = 'none';
            otherOptions.style.display = 'none';
            authMessage.textContent = '';
            authMessage.className = 'message';
            phoneInput.value = '';
            otpInput.value = '';
            otpInput.disabled = false;
            otpSent = false;
        };
    </script>
</body>
</html>
