<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CarePlus Hospital</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* Phase 3.1: Authentication UI Styles - Fixed Layout */
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color) 0%, #005aca 100%);
            padding: 20px;
        }

        .auth-content {
            display: none;
        }

        .auth-left {
            display: none;
        }

        .auth-right {
            display: none;
        }

        .auth-form-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            box-sizing: border-box;
        }

        .auth-form-card-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-form-card-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 12px;
        }

        .auth-form-card-subtitle {
            font-size: 14px;
            color: var(--text-light);
        }

        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .role-btn {
            padding: 10px 20px;
            background: var(--background-color);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .role-btn:hover {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: white;
        }

        .role-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        .form-title {
            font-size: 22px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 24px;
            color: var(--secondary-color);
        }

        .auth-form-group {
            margin-bottom: 18px;
        }

        .auth-form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
        }

        .auth-form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .auth-form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1);
        }

        .doctor-id-section {
            display: none;
        }

        .doctor-id-section.active {
            display: block;
        }

        .doctor-id-section small {
            color: var(--text-light);
            font-size: 12px;
            display: block;
            margin-top: 4px;
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            box-sizing: border-box;
        }

        .auth-btn:hover:not(:disabled) {
            background: #0056a8;
            transform: translateY(-2px);
        }

        .auth-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }

        .auth-message.success {
            background: #d1f2d5;
            color: #237c37;
            display: block;
        }

        .auth-message.error {
            background: #ffd5d5;
            color: #d10000;
            display: block;
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-light);
        }

        .auth-footer a {
            color: var(--primary-color);
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .auth-container {
                padding: 16px;
            }

            .auth-form-card {
                padding: 30px 20px;
                max-width: 100%;
            }

            .auth-form-card-title {
                font-size: 24px;
            }

            .form-title {
                font-size: 20px;
            }

            .role-selector {
                gap: 8px;
                margin-bottom: 24px;
            }

            .role-btn {
                padding: 9px 16px;
                font-size: 13px;
            }

            .auth-form-input {
                padding: 10px;
                font-size: 16px;
            }

            .auth-btn {
                padding: 11px;
                font-size: 15px;
            }
        }

        @media (max-width: 1024px) {
            .auth-form-card {
                max-width: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-form-card">
            <!-- Header -->
            <div class="auth-form-card-header">
                <div class="auth-form-card-title">CarePlus</div>
                <div class="auth-form-card-subtitle">Doctor & Admin Login</div>
            </div>

            <!-- Phase 3.1: Role Selector (Patient signup removed - use patient-login.html) -->
            <div class="role-selector">
                <button class="role-btn active" data-role="doctor">Doctor</button>
                <button class="role-btn" data-role="admin">Admin</button>
            </div>

            <!-- Message Display -->
            <div class="auth-message"></div>

            <!-- Login Form -->
            <form id="authForm">
                <h3 class="form-title" id="formTitle">Doctor Login</h3>

                <div class="auth-form-group">
                    <label class="auth-form-label">Email Address</label>
                    <input type="email" class="auth-form-input" name="email" placeholder="Enter your email" required>
                </div>

                <div class="auth-form-group">
                    <label class="auth-form-label">Password</label>
                    <input type="password" class="auth-form-input" name="password" placeholder="Enter password" required>
                </div>

                <!-- Phase 3.1: Doctor ID Field (always shown for doctor/admin) -->
                <div class="auth-form-group doctor-id-section active">
                    <label class="auth-form-label">Doctor/Admin ID</label>
                    <input type="text" class="auth-form-input" name="doctorId" placeholder="Enter your ID">
                    <small>Required for doctor accounts</small>
                </div>

                <button type="submit" class="auth-btn">Login</button>
            </form>

            <div class="auth-footer">
                <!-- Phase 3.1: Patient login link -->
                Patient? <a href="patient-login.html">Login here</a>
            </div>
        </div>
    </div>

    <script type="module">
        // Phase 3: Role-Based Authentication System
        import { auth, db } from './assets/js/firebase.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const roleButtons = document.querySelectorAll('.role-btn');
        const authForm = document.getElementById('authForm');
        const formTitle = document.getElementById('formTitle');
        const messageDiv = document.querySelector('.auth-message');
        const doctorIdSection = document.querySelector('.doctor-id-section');
        let selectedRole = 'doctor';

        // Phase 3.1: Role Selection Handler (patient signup removed)
        roleButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                roleButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedRole = btn.dataset.role;

                // Update form title
                formTitle.textContent = `${selectedRole.charAt(0).toUpperCase() + selectedRole.slice(1)} Login`;

                // Doctor ID always shown for doctor/admin
                if (selectedRole === 'doctor' || selectedRole === 'admin') {
                    doctorIdSection.classList.add('active');
                }

                // Clear messages
                messageDiv.textContent = '';
                messageDiv.classList.remove('success', 'error');
            });
        });

        // Phase 3: Authentication Handler
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = authForm.querySelector('input[name="email"]').value;
            const password = authForm.querySelector('input[name="password"]').value;
            const doctorId = authForm.querySelector('input[name="doctorId"]')?.value || null;

            const submitBtn = authForm.querySelector('.auth-btn');
            const originalText = submitBtn.textContent;

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Logging in...';
                messageDiv.classList.remove('success', 'error');

                // Authenticate with Firebase
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Phase 3: Verify Role-Based Access
                const usersRef = collection(db, 'users');
                const q = query(usersRef, where('uid', '==', user.uid));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    throw new Error('User profile not found. Please contact admin.');
                }

                const userProfile = querySnapshot.docs[0].data();

                // Verify role matches
                if (userProfile.role !== selectedRole) {
                    throw new Error(`This account is registered as a ${userProfile.role}. Please select the correct role.`);
                }

                // Doctor-specific validation
                if (selectedRole === 'doctor' && userProfile.doctorId !== doctorId) {
                    throw new Error('Invalid Doctor ID for this account.');
                }

                // Phase 3: Store role and user info in sessionStorage
                sessionStorage.setItem('careplus_user', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    role: userProfile.role,
                    name: userProfile.name || email,
                    doctorId: userProfile.doctorId || null
                }));

                // Show success and redirect
                messageDiv.textContent = `Welcome ${userProfile.role}!`;
                messageDiv.classList.add('success');

                // Redirect based on role
                setTimeout(() => {
                    if (selectedRole === 'patient') {
                        window.location.href = 'appointment.html';
                    } else if (selectedRole === 'doctor') {
                        window.location.href = 'doctor-dashboard.html';
                    } else if (selectedRole === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    }
                }, 1500);

            } catch (error) {
                console.error('Auth Error:', error);
                messageDiv.textContent = error.message || 'Login failed. Please try again.';
                messageDiv.classList.add('error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });
    </script>
</body>
</html>
